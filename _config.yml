# Basic Information
# This repo is served as a GitHub Pages *project* site (no custom domain via
# CNAME), i.e. at https://jayden-asc5.github.io/Jayden-Smith.github.io/ — so
# baseurl must be set for any root-relative link (relative_url filter, etc.)
# to resolve correctly instead of pointing at the bare domain.
baseurl: /Jayden-Smith.github.io
title: Jayden Smith
position: Ph.D. Student
affiliation: Rensselaer Polytechnic Institute
email: smithj32@rpi.edu

# Search Engine Optimization (SEO)
# The following information is used to improve the website traffic from search engines, e.g., Google.
keywords: minimal light
description: The Minimal Light is a simple and elegant jekyll theme for academic personal homepage.
canonical: https://randychen233.github.io

# Links 
# If you don't need one of them, you may delete the corresponding line.
google_scholar: https://scholar.google.com/citations?user=FI5V8LUAAAAJ&hl=en&authuser=1
cv_link: assets/files/Jayden_Smith_Resume.pdf
github_link: https://github.com/Jayden-ASC5
linkedin: https://www.linkedin.com/in/jayden-smith/

# Images (e.g., your profile picture and your website's favicon) 
# "favicon" and "favicon_dark" are used for the light and dark modes, respectively. 
avatar: ./assets/img/avatar.jpg
favicon: ./assets/img/favicon.ico
favicon_dark: ./assets/img/favicon.ico

# Footnote
# You may use the option to disable the footnote, "Powered by Jekyll and Minimal Light theme."
enable_footnote: false

# Auto Dark Mode
# You may use the option to disable the automatic dark theme
auto_dark_mode: true

# Font
# You can use this option to choose between Serif or Sans Serif fonts.
font: "Serif" # or "Sans Serif"

# Google Analytics ID
# Please remove this if you don't use Google Analytics
google_analytics:  G-MP0PP1S0CB

# Use this project as a remote theme for GitHub Pages
# See the guide here: https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
remote_theme: yaoyao-liu/minimal-light

# The following files will be removed from the generated website.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_zh_Hans.md
  - README_zh_Hant.md
  - README_de.md
  - LICENSE
  - minimal-light.gemspec
  - html_source_file/

# Portfolio
# Each project lives as its own file in _projects/, gets its own page, and is
# grouped on the portfolio index by its "category" front matter field. Add a
# new category here (order = display order); it only appears on the page once
# at least one project uses it.
collections:
  projects:
    output: true
    permalink: /portfolio/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

project_categories:
  - Research
  - Internships
  - Class Projects
  - Clubs & Leadership
  - Personal Projects
